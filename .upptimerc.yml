# ═══════════════════════════════════════════════════════════════════════
# UPPTIME — configuração PRONTA do vigia de queda do Portal Darcy
#
# 24/08/2026 · escrito para a decisão «principalmente o Upptime».
#
# O QUE É ISTO: o Upptime é um vigia de queda que roda DENTRO do GitHub —
# de graça, para sempre, sem conta em serviço de terceiro e sem cláusula
# de «uso pessoal». A cada 5 minutos o GitHub Actions pede os endereços
# abaixo; caindo algum, ele ABRE UMA ISSUE no repositório e o GitHub
# manda e-mail para quem estiver em `assignees`.
#
# COMO USAR: este arquivo vai para a RAIZ do repositório novo de status,
# com o nome exato `.upptimerc.yml` (começa com ponto).
# O passo a passo está em `00_documentacao/CHECKLIST_PROXIMA_JANELA.html`.
#
# ⚠️ AS CHAVES DESTE ARQUIVO FORAM CONFERIDAS NA DOCUMENTAÇÃO OFICIAL
# em 24/08/2026 (upptime.js.org/docs/configuration) — não foram escritas
# de memória. A que faz o trabalho de verdade é
# `__dangerous__body_down_if_text_missing`: ela é o equivalente ao
# «monitor de palavra-chave», e é o que impede o vigia de se contentar
# com «HTTP 200» — a armadilha nº 1 deste projeto.
# ═══════════════════════════════════════════════════════════════════════

owner: futsalgv-maker          # ⬅ dono do repositório (medido no remote do Portal)
repo: status-darcy             # ⬅ nome do repositório NOVO, público, só para isto

sites:
  # ── 1 · O BANCO DE DADOS — este é o que importa ──────────────────────
  # Endereço construído em 24/08 justamente para isto: ele só responde
  # PORTAL_OK depois de ir ao banco e voltar. Banco fora → 503.
  - name: Portal Darcy — banco de dados
    url: https://athtkajuzvgkpbzgnoiu.supabase.co/functions/v1/saude
    __dangerous__body_down_if_text_missing: PORTAL_OK

  # ── 2 · O SITE — a porta da frente ───────────────────────────────────
  # A palavra foi MEDIDA no HTML que o servidor realmente entrega
  # (24/08: aparece 5 vezes, inclusive no <title>). Trocando o título da
  # home, é esta linha que se corrige — não o site.
  - name: Portal Darcy — site
    url: https://www.darcyribeiro.com.br/painel.html
    __dangerous__body_down_if_text_missing: Portal Educacional


  # ── 3 · CONTROLE TEMPORÁRIO — endereço que NÃO existe ────────────────
  # ⚠️ ESTE BLOCO É TESTE E SAI DEPOIS. Existe para provar a corrente
  # inteira — queda → issue no repositório → e-mail para o gestor —, que é
  # a única parte que nenhuma medição minha alcança. É uma rota inventada
  # no domínio da escola: o HostGator responde 404 a ela.
  - name: CONTROLE (teste do vigia) - endereco inventado
    url: https://www.darcyribeiro.com.br/__teste_do_vigia_nao_existe__.html
# ── quem é avisado ─────────────────────────────────────────────────────
# O Upptime abre uma issue no repositório quando algo cai e a atribui a
# estas pessoas; o GitHub manda o e-mail. ⚠️ Um nome só é um ponto único
# de falha — acrescente um segundo assim que houver um segundo usuário.
assignees:
  - futsalgv-maker

# ── de quanto em quanto tempo ──────────────────────────────────────────
# 5 minutos é o mínimo que o agendador do GitHub Actions aceita, e é o
# mesmo do plano grátis do UptimeRobot. O agendamento é «melhor esforço»:
# em horário de pico o GitHub pode atrasar alguns minutos.
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"
  summary: "0 1 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"

# ── a página pública de status ─────────────────────────────────────────
# ⚠️ ELA É PÚBLICA e leva o nome da escola. É um efeito colateral bom
# (a comunidade pode conferir se «o sistema está fora» é verdade), mas é
# uma decisão do gestor, não minha — está escrita no checklist.
# 📌 NOTA HONESTA: os rótulos da página saem em INGLÊS por padrão. O
# Upptime tem uma chave `i18n` para traduzir, mas eu NÃO a preenchi aqui
# porque não conferi os nomes das subchaves na documentação — e nesta
# casa não se escreve configuração de memória. Fica para uma segunda
# passada, depois que o vigia estiver funcionando.
status-website:
  # ⚠️ SEM domínio próprio, o `baseUrl` é OBRIGATÓRIO e tem de ser o nome do
  # repositório: a página mora em futsalgv-maker.github.io/status-darcy e, sem
  # esta linha, o CSS e os links saem quebrados. O template vem com
  # `cname: demo.upptime.js.org` — esse cname É DELES e tem de sair.
  baseUrl: /status-darcy
  name: Status do Portal Educacional
  introTitle: Portal Educacional — E. E. Prof. Darcy Ribeiro
  introMessage: Página automática de disponibilidade do Portal. Verificação a cada 5 minutos.
  navbar:
    - title: Status
      href: /
    - title: Portal
      href: https://www.darcyribeiro.com.br
